name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  email-link-check:
    name: Email link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify welcome email links point to real pages
        run: node scripts/check-email-links.mjs
